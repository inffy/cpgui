name: Release

# Pushing a tag like v0.2.0 builds cherry-picker.pyz and publishes it as release v0.2.0:
#   git tag -a v0.2.0 -m "Cherry Picker 0.2.0" && git push origin v0.2.0
# Ordinary pushes and merges don't release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cherry-picker.pyz
        run: python3 build.py "$GITHUB_REF_NAME"

      - name: Check that it runs
        run: python3 dist/cherry-picker.pyz --version

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading the build to it"
            gh release upload "$TAG" dist/cherry-picker.pyz --clobber
          else
            gh release create "$TAG" dist/cherry-picker.pyz --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
