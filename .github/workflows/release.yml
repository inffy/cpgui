name: Release

# Push a tag like v0.2.0 to build cherry-picker.pyz and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cherry-picker.pyz
        run: python3 build.py "${GITHUB_REF_NAME}"

      - name: Check that it runs
        run: python3 dist/cherry-picker.pyz --version

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/cherry-picker.pyz --title "$GITHUB_REF_NAME" --generate-notes
